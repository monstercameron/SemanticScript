name: Release

# Cut a release of the single-file `semanticscript` toolchain. Push a `v*` tag
# (matching version.json) or dispatch manually. Builds the PyInstaller binary on
# each OS via semanticscript/packaging/package.py, smoke-tests it, then publishes
# a GitHub release with the per-OS binaries, a SHA256SUMS file, and the
# third-party attribution. Modeled on the proven compiler-exe.yml freeze step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (must match version.json, e.g. v0.4.0)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Freeze (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: semanticscript-windows-x64.exe
            exe: semanticscript/packaging/dist/semanticscript.exe
          - os: ubuntu-latest
            asset: semanticscript-linux-x64
            exe: semanticscript/packaging/dist/semanticscript
          - os: macos-latest
            asset: semanticscript-macos-arm64
            exe: semanticscript/packaging/dist/semanticscript
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.20.0

      - name: Freeze the compiler (PyInstaller via packaging/package.py)
        run: python semanticscript/packaging/package.py

      - name: Smoke-test the frozen executable (self-contained)
        shell: bash
        run: |
          set -euo pipefail
          exe="${{ matrix.exe }}"
          test -f "$exe" || { echo "Expected PyInstaller output at $exe"; exit 1; }
          # R-110: match/exceed compiler-exe.yml — copy the exe + a program into an
          # isolated dir with NO repo files, so the test proves the frozen asset is
          # fully self-contained (it cannot fall back to the checkout's std /
          # runtime / third_party / version.json).
          box="${RUNNER_TEMP:-/tmp}/ssbox"
          rm -rf "$box"; mkdir -p "$box"
          cp "$exe" "$box/"; cp examples/hello_world.sem "$box/"
          name="$(basename "$exe")"
          cd "$box"
          "./$name" version
          # Bundled version.json resolves under _MEIPASS -> status carries releaseVersion.
          "./$name" status --json | python -c "import sys,json; assert json.load(sys.stdin).get('releaseVersion'), 'status missing releaseVersion (version.json not bundled)'"
          # JIT path: bundled std/runtime + llvmlite run a program end to end.
          "./$name" run hello_world.sem
          # MCP stdio server advertises its tools.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "./$name" mcp \
            | python -c "import sys,json; rs=[json.loads(l) for l in sys.stdin if l.strip()]; t=[r for r in rs if r.get('id')==1][0]['result']['tools']; assert len(t)>=1, 'MCP tools/list returned no tools'"
          # Native link path (bundled runtime C sources + clang), where a C
          # toolchain is present on the runner; never fails the release if absent.
          if [ "${RUNNER_OS}" = "Windows" ]; then nexe="hw.exe"; else nexe="hw"; fi
          if "./$name" build hello_world.sem -o "$nexe" 2>build.log; then
            "./$nexe"
            echo "native build smoke: ok"
          else
            echo "native build smoke: skipped (no C toolchain on PATH)"; cat build.log || true
          fi

      - name: Stage the named artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "${{ matrix.exe }}" "staging/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: staging/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve + verify tag against version.json
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json;print(json.load(open("version.json"))["version"])')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "Tag '$tag' does not match version.json version '$version' (expected 'v$version')."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.x releases publish as prereleases.
          case "$version" in 0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Artifacts download nested under their artifact-name dirs; flatten.
          find artifacts -type f -exec cp {} release/ \;
          cp THIRD_PARTY_LICENSES.md release/
          cp LICENSE release/LICENSE.txt
          cd release
          sha256sum semanticscript-* > SHA256SUMS
          echo "Release assets:"; ls -la

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          notes="SemanticScript ${TAG}. See CHANGELOG.md for details. Verify downloads against SHA256SUMS; third-party attribution in THIRD_PARTY_LICENSES.md."
          common=(--repo "${{ github.repository }}" --title "SemanticScript ${TAG}" --notes "$notes")
          if [ "$PRERELEASE" = "true" ]; then common+=(--prerelease); fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" "${common[@]}"
          else
            create=("${common[@]}" --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then create+=(--latest=false); fi
            gh release create "$TAG" "${create[@]}"
          fi
          gh release upload "$TAG" release/* --repo "${{ github.repository }}" --clobber
