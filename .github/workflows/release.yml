name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, matching version.json (for example v0.0.1)."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-semanticscript/package-lock.json

      - name: Install VS Code extension dependencies
        run: npm --prefix vscode-semanticscript ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-mcp.txt

      - name: Run fast Python suite
        run: python SemanticScript/tests/run_suite.py ci-fast

      - name: Run editor suite
        run: python SemanticScript/tests/run_suite.py editor

      - name: Run release suite
        run: python SemanticScript/tests/run_suite.py ci-release

      - name: Install release packaging dependencies
        run: python -m pip install pyinstaller==6.20.0

      - name: Build sem single-file executable
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/sem.spec

      # Optional Authenticode signing via Azure Trusted Signing. Skipped unless
      # the repository variable AZURE_SIGN_ENABLED is "true" and the matching
      # secrets/variables are configured, so unsigned releases still build.
      # Runs before validation/bundling so the signed exe is what ships and is
      # embedded in the .mcpb bundle.
      - name: Sign sem.exe (Azure Trusted Signing)
        if: ${{ vars.AZURE_SIGN_ENABLED == 'true' }}
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe

      - name: Validate sem single-file executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sem = "dist\sem.exe"
          if (-not (Test-Path -Path $sem -PathType Leaf)) {
            throw "Expected PyInstaller output at $sem."
          }

          & $sem version --json
          if ($LASTEXITCODE -ne 0) { throw "sem version failed with $LASTEXITCODE." }

          & $sem skills list --json
          if ($LASTEXITCODE -ne 0) { throw "sem skills list failed with $LASTEXITCODE." }

          & $sem skills get taskforge-web-patterns --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "sem skills get taskforge-web-patterns failed with $LASTEXITCODE." }

          & $sem check --json SemanticScript\tests\agent_cli_demo.test.sem
          if ($LASTEXITCODE -ne 0) { throw "sem check failed with $LASTEXITCODE." }

          & $sem fmt --check SemanticScript\tests\agent_cli_demo.test.sem
          if ($LASTEXITCODE -ne 0) { throw "sem fmt failed with $LASTEXITCODE." }

          & $sem lint SemanticScript\tests\tiny.sem -- --summary
          if ($LASTEXITCODE -ne 0) { throw "sem lint failed with $LASTEXITCODE." }

          & $sem emit-ir SemanticScript\tests\agent_cli_demo.test.sem --quiet
          if ($LASTEXITCODE -ne 0) { throw "sem emit-ir failed with $LASTEXITCODE." }

          & $sem run SemanticScript\tests\agent_cli_demo.test.sem
          if ($LASTEXITCODE -ne 0) { throw "sem run failed with $LASTEXITCODE." }

          # MCP server reads JSON-RPC from stdin; empty stdin yields EOF so it
          # starts, initializes, and shuts down cleanly. Proves the bundled mcp
          # SDK loads inside the frozen executable.
          $null | & $sem mcp
          if ($LASTEXITCODE -ne 0) { throw "sem mcp failed to start with $LASTEXITCODE." }

      - name: Remove stale VSIX artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path "vscode-semanticscript" -Filter "*.vsix" -File | Remove-Item -Force

      - name: Package VS Code extension
        run: npm --prefix vscode-semanticscript run package:vsix

      - name: Build .mcpb Desktop Extension bundle
        run: python packaging/mcpb/build_mcpb.py --sem-exe dist/sem.exe --output dist/semanticscript.mcpb

      - name: Stamp distribution manifests (scoop, winget, registry)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionInfo = Get-Content -Raw -Path "version.json" | ConvertFrom-Json
          python packaging/release_manifests.py `
            --exe dist/sem.exe `
            --mcpb dist/semanticscript.mcpb `
            --tag "v$($versionInfo.version)" `
            --outdir dist/manifests
          if ($LASTEXITCODE -ne 0) { throw "manifest stamping failed with $LASTEXITCODE." }

      - name: Generate release manifest
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $versionInfo = Get-Content -Raw -Path "version.json" | ConvertFrom-Json
          $repoVersion = $versionInfo.version
          if (-not $repoVersion) {
            throw "version.json does not contain a version field."
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.ref_name }}" -ne "${{ github.event.repository.default_branch }}") {
            throw "Manual release dispatch must run from the default branch."
          }

          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
          } else {
            $releaseTag = "${{ inputs.tag }}"
            if (-not $releaseTag) {
              throw "Manual release dispatch requires an explicit tag input."
            }
          }

          if ($releaseTag -ne "v$repoVersion") {
            throw "Tag '$releaseTag' does not match version.json version '$repoVersion'. Expected 'v$repoVersion'."
          }

          git fetch --force --tags
          $releaseCommit = (git rev-list -n 1 $releaseTag).Trim()
          if (-not $releaseCommit) {
            throw "Could not resolve release commit for tag '$releaseTag'."
          }
          $releaseShortSha = (git rev-parse --short $releaseCommit).Trim()
          $releaseSubject = (git log -1 --format=%s $releaseCommit).Trim()
          $releaseBody = (git log -1 --format=%b $releaseCommit).Trim()

          $previousTag = ""
          $previousTagOutput = git describe --tags --abbrev=0 "$releaseCommit^" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $previousTag = ($previousTagOutput | Select-Object -First 1).Trim()
          }

          $commitRange = $releaseCommit
          $commitRangeLabel = $releaseShortSha
          $commitListTruncated = $false
          $commitLogArgs = @("log", "--reverse", "--format=%H%x09%h%x09%s")
          if ($previousTag) {
            $commitRange = "$previousTag..$releaseCommit"
            $commitRangeLabel = "$previousTag..$releaseShortSha"
            $commitLogArgs += $commitRange
          } else {
            $commitCount = [int](git rev-list --count $releaseCommit)
            if ($commitCount -gt 50) {
              $commitListTruncated = $true
            }
            $commitLogArgs += "--max-count=50"
            $commitLogArgs += $releaseCommit
          }

          $commitRows = git @commitLogArgs
          $commits = @()
          foreach ($row in $commitRows) {
            if (-not $row) { continue }
            $parts = $row -split "`t", 3
            if ($parts.Count -lt 3) { continue }
            $commits += [ordered]@{
              sha = $parts[0]
              shortSha = $parts[1]
              subject = $parts[2]
            }
          }

          $artifactDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $semExecutable = "dist\sem.exe"
          if (-not (Test-Path -Path $semExecutable -PathType Leaf)) {
            throw "Expected sem single-file executable at $semExecutable."
          }
          $releaseSemExeName = "semanticscript-sem-windows-x64-$releaseTag.exe"
          $releaseSemExePath = Join-Path $artifactDir $releaseSemExeName
          Copy-Item -Path $semExecutable -Destination $releaseSemExePath -Force

          $vsixFiles = Get-ChildItem -Path "vscode-semanticscript" -Filter "*.vsix" -File
          if ($vsixFiles.Count -ne 1) {
            throw "Expected exactly one VSIX artifact, found $($vsixFiles.Count)."
          }

          $vsix = $vsixFiles[0]
          $releaseVsixName = "semanticscript-vscode-$releaseTag.vsix"
          $releaseVsixPath = Join-Path $artifactDir $releaseVsixName
          Copy-Item -Path $vsix.FullName -Destination $releaseVsixPath -Force

          $commands = @(
            "python SemanticScript/tests/run_suite.py ci-fast",
            "python SemanticScript/tests/run_suite.py editor",
            "python SemanticScript/tests/run_suite.py ci-release",
            "python -m pip install pyinstaller==6.20.0",
            "python -m PyInstaller --noconfirm --clean packaging/pyinstaller/sem.spec",
            "dist/sem.exe version --json",
            "dist/sem.exe skills list --json",
            "dist/sem.exe skills get taskforge-web-patterns --json",
            "dist/sem.exe check --json SemanticScript/tests/agent_cli_demo.test.sem",
            "dist/sem.exe fmt --check SemanticScript/tests/agent_cli_demo.test.sem",
            "dist/sem.exe lint SemanticScript/tests/tiny.sem -- --summary",
            "dist/sem.exe emit-ir SemanticScript/tests/agent_cli_demo.test.sem --quiet",
            "dist/sem.exe run SemanticScript/tests/agent_cli_demo.test.sem",
            "npm --prefix vscode-semanticscript ci",
            "npm --prefix vscode-semanticscript run package:vsix"
          )

          $artifactSpecs = @(
            @{
              name = "semanticscript-sem-windows-x64"
              description = "Single-file Windows sem compiler and toolchain executable"
              path = $releaseSemExePath
            },
            @{
              name = "semanticscript-vscode-vsix"
              description = "VS Code extension package"
              path = $releaseVsixPath
            }
          )

          $artifacts = foreach ($artifact in $artifactSpecs) {
            $file = Get-Item -Path $artifact.path
            @{
              name = $artifact.name
              description = $artifact.description
              fileName = $file.Name
              path = $artifact.path.Replace("\", "/")
              bytes = $file.Length
              sha256 = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          $manifest = [ordered]@{
            schemaVersion = "sem.releaseManifest.v1"
            repoVersion = $repoVersion
            versionNote = "SemanticScript $repoVersion release. Download $releaseSemExeName for the single-file Windows compiler/toolchain."
            tag = $releaseTag
            ref = "${{ github.ref }}"
            refName = "${{ github.ref_name }}"
            refType = "${{ github.ref_type }}"
            commitSha = $releaseCommit
            previousTag = $previousTag
            commitRange = $commitRange
            commitRangeLabel = $commitRangeLabel
            commitListTruncated = $commitListTruncated
            releaseCommit = [ordered]@{
              sha = $releaseCommit
              shortSha = $releaseShortSha
              subject = $releaseSubject
              body = $releaseBody
            }
            commits = $commits
            dateUtc = (Get-Date).ToUniversalTime().ToString("o")
            commands = $commands
            artifacts = $artifacts
          }

          $manifestPath = Join-Path $artifactDir "semanticscript-release-manifest-$releaseTag.json"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path $manifestPath -Encoding utf8

          $downloadLines = foreach ($artifact in $artifacts) {
            "- $($artifact.fileName) - $($artifact.description). SHA-256: $($artifact.sha256)"
          }
          $changeLines = foreach ($commit in $commits) {
            "- $($commit.shortSha) - $($commit.subject)"
          }
          if (-not $changeLines) {
            $changeLines = @("- No commits were found for range $commitRangeLabel.")
          }
          if ($commitListTruncated) {
            $changeLines += "- Commit list truncated to the latest 50 commits because this release has no previous tag."
          }

          $notes = @(
            "SemanticScript $releaseTag",
            "",
            "Version note:",
            "- Repository/toolchain version: $repoVersion",
            "- Compiler/toolchain download: $releaseSemExeName",
            "- VS Code extension download: $releaseVsixName",
            "- The Windows compiler/toolchain artifact is a single-file sem.exe package; it extracts an internal temporary payload at runtime.",
            "",
            "Release commit:",
            "- $releaseShortSha - $releaseSubject",
            "- Full SHA: $releaseCommit",
            "",
            "Changes in $commitRangeLabel:",
            $changeLines,
            "",
            "Downloads:",
            $downloadLines,
            "- $(Split-Path -Leaf $manifestPath) - Release manifest with artifact metadata and checksums.",
            "",
            "Validation:",
            "- python SemanticScript/tests/run_suite.py ci-fast",
            "- python SemanticScript/tests/run_suite.py editor",
            "- python SemanticScript/tests/run_suite.py ci-release",
            "- PyInstaller sem single-file executable smoke validation",
            "- npm --prefix vscode-semanticscript ci",
            "- npm --prefix vscode-semanticscript run package:vsix"
          ) -join "`n"

          $notesPath = Join-Path $artifactDir "semanticscript-release-notes-$releaseTag.md"
          $notes | Set-Content -Path $notesPath -Encoding utf8

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "repo_version=$repoVersion" >> $env:GITHUB_OUTPUT
          "release_commit=$releaseCommit" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          "sem_exe_path=$releaseSemExePath" >> $env:GITHUB_OUTPUT
          "vsix_path=$releaseVsixPath" >> $env:GITHUB_OUTPUT

      - name: Upload sem executable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-sem-windows-x64
          path: ${{ steps.manifest.outputs.sem_exe_path }}
          if-no-files-found: error

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-vscode-vsix
          path: ${{ steps.manifest.outputs.vsix_path }}
          if-no-files-found: error

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-release-manifest
          path: ${{ steps.manifest.outputs.manifest_path }}
          if-no-files-found: error

      - name: Upload .mcpb bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-mcpb
          path: dist/semanticscript.mcpb
          if-no-files-found: error

      - name: Upload distribution manifests artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-distribution-manifests
          path: dist/manifests/**
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.manifest.outputs.release_tag }}
          REPO_VERSION: ${{ steps.manifest.outputs.repo_version }}
          RELEASE_COMMIT: ${{ steps.manifest.outputs.release_commit }}
          SEM_EXE_PATH: ${{ steps.manifest.outputs.sem_exe_path }}
          VSIX_PATH: ${{ steps.manifest.outputs.vsix_path }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          NOTES_PATH: ${{ steps.manifest.outputs.notes_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $true
          }

          $title = "SemanticScript $env:RELEASE_TAG"

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --repo "${{ github.repository }}" --title $title --notes-file $env:NOTES_PATH --target $env:RELEASE_COMMIT
          } else {
            gh release create $env:RELEASE_TAG --repo "${{ github.repository }}" --title $title --notes-file $env:NOTES_PATH --target $env:RELEASE_COMMIT --verify-tag
          }

          # Stable-named copies (sem.exe, semanticscript.mcpb) plus the stamped
          # registry server.json back the releases/download/v<version>/ URLs in
          # the scoop, winget, and MCP registry manifests.
          gh release upload $env:RELEASE_TAG $env:SEM_EXE_PATH $env:VSIX_PATH $env:MANIFEST_PATH "dist/sem.exe" "dist/semanticscript.mcpb" "dist/manifests/registry/server.json" --repo "${{ github.repository }}" --clobber

          $expectedAssets = @(
            (Split-Path -Leaf $env:SEM_EXE_PATH),
            (Split-Path -Leaf $env:VSIX_PATH),
            (Split-Path -Leaf $env:MANIFEST_PATH),
            "sem.exe",
            "semanticscript.mcpb",
            "server.json"
          )
          $release = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($assetName in $expectedAssets) {
            if ($assetName -notin $assetNames) {
              throw "GitHub release '$env:RELEASE_TAG' is missing downloadable asset '$assetName'."
            }
          }
