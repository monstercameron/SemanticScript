name: Build compiler executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Freeze semanticscript.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.20.0

      - name: Put clang/LLVM on PATH  # needed if the smoke run links a native runtime
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) { Add-Content -Path $env:GITHUB_PATH -Value $llvm }

      - name: Freeze the compiler (PyInstaller via packaging/package.py)
        run: python semanticscript/packaging/package.py

      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Copy the exe + a couple of programs to an isolated dir with NO repo
          # files, so the test proves the exe is fully self-contained (it cannot
          # fall back to the checkout's std/runtime/third_party/version.json).
          $box = Join-Path $env:RUNNER_TEMP "ssbox"
          New-Item -ItemType Directory -Force -Path $box | Out-Null
          Copy-Item "semanticscript\packaging\dist\semanticscript.exe" $box
          Copy-Item "examples\hello_world.sem" $box
          $exe = Join-Path $box "semanticscript.exe"
          if (-not (Test-Path -Path $exe -PathType Leaf)) { throw "No PyInstaller output." }
          Push-Location $box
          try {
            & $exe version; if ($LASTEXITCODE -ne 0) { throw "version failed ($LASTEXITCODE)." }
            # releaseVersion proves the bundled version.json resolves under _MEIPASS.
            $status = & $exe status --json | ConvertFrom-Json
            if (-not $status.releaseVersion) { throw "status missing releaseVersion (version.json not bundled)." }
            # JIT path: bundled std/runtime + llvmlite run a program end to end.
            & $exe run hello_world.sem; if ($LASTEXITCODE -ne 0) { throw "run failed ($LASTEXITCODE)." }
            # Native link path: bundled runtime C sources + clang build a real exe.
            & $exe build hello_world.sem -o hw.exe; if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)." }
            & .\hw.exe; if ($LASTEXITCODE -ne 0) { throw "native hw.exe failed ($LASTEXITCODE)." }
            # MCP stdio server advertises its tools.
            $mcp = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | & $exe mcp | ConvertFrom-Json
            if ($mcp.result.tools.Count -lt 1) { throw "MCP tools/list returned no tools." }
          } finally { Pop-Location }

      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-exe
          path: semanticscript/packaging/dist/semanticscript.exe
          if-no-files-found: error
