name: Build compiler executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sem-exe:
    name: Build sem.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install pyinstaller==6.20.0

      - name: Build sem single-file executable
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/sem.spec

      - name: Validate sem executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sem = "dist\sem.exe"
          if (-not (Test-Path -Path $sem -PathType Leaf)) {
            throw "Expected PyInstaller output at $sem."
          }

          & $sem version --json
          if ($LASTEXITCODE -ne 0) { throw "sem version failed with $LASTEXITCODE." }

          & $sem check --json SemanticScript\tests\agent_cli_demo.test.sem
          if ($LASTEXITCODE -ne 0) { throw "sem check failed with $LASTEXITCODE." }

          & $sem fmt --check SemanticScript\tests\agent_cli_demo.test.sem
          if ($LASTEXITCODE -ne 0) { throw "sem fmt failed with $LASTEXITCODE." }

      - name: Stage compiler artifact
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $artifactDir = "compiler-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $artifactName = "semanticscript-sem-windows-x64-$shortSha.exe"
          $artifactPath = Join-Path $artifactDir $artifactName
          Copy-Item -Path "dist\sem.exe" -Destination $artifactPath -Force
          "artifact_path=$artifactPath" >> $env:GITHUB_OUTPUT

      - name: Upload compiler executable
        uses: actions/upload-artifact@v7
        with:
          name: semanticscript-sem-windows-x64
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
