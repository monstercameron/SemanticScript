name: Build compiler executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Freeze semanticscript.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.20.0

      - name: Put clang/LLVM on PATH  # needed if the smoke run links a native runtime
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) { Add-Content -Path $env:GITHUB_PATH -Value $llvm }

      - name: Freeze the compiler (PyInstaller via packaging/package.py)
        run: python semanticscript/packaging/package.py

      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "semanticscript\packaging\dist\semanticscript.exe"
          if (-not (Test-Path -Path $exe -PathType Leaf)) {
            throw "Expected PyInstaller output at $exe."
          }
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "semanticscript version failed with $LASTEXITCODE." }
          # Proves the bundled std/sigs/runtime data + llvmlite JIT load inside the
          # frozen exe and a program runs end to end.
          & $exe run examples/hello_world.sem
          if ($LASTEXITCODE -ne 0) { throw "semanticscript run hello_world failed with $LASTEXITCODE." }

      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semanticscript-exe
          path: semanticscript/packaging/dist/semanticscript.exe
          if-no-files-found: error
