name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Branch protection requires "Validate compiler (Windows, Python 3.11)" and
    # "Validate compiler (Windows, Python 3.12)"; keep those names stable.
    name: Validate compiler (${{ matrix.os-name }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            python-version: "3.11"
          - os: windows-latest
            os-name: Windows
            python-version: "3.12"
          - os: ubuntu-latest
            os-name: Linux
            python-version: "3.12"
          # D-150: the runtime's system layer on AArch64 Linux (svc #0, the kernel's generic system call numbers)
          - os: ubuntu-24.04-arm
            os-name: Linux AArch64
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Check every worked example
        shell: bash
        run: |
          set -euo pipefail
          for project in docs/refined-examples/*/; do
            python semanticscript/compiler/refined check "$project"
          done

      - name: Check generated references are up to date
        shell: bash
        run: |
          set -euo pipefail
          python semanticscript/compiler/refined grammar --output docs/refined-grammar.md
          python semanticscript/compiler/refined grammar --textmate --output vscode-semanticscript/syntaxes/semanticscript.tm-language.json
          git diff --exit-code -- docs/refined-grammar.md vscode-semanticscript/syntaxes/semanticscript.tm-language.json

  macos:
    # D-189: executables for macOS on Apple silicon with no C library (no libSystem), reaching the kernel through
    # its system calls; only tests/test_macos_nolibc.py runs here, the rest of the suite being Windows's and Linux's.
    # macos-15 is GitHub's arm64 image (macos-14 is retired)
    name: macOS executables with no C library (arm64, Python 3.12)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run the macOS tests
        run: python -m pytest tests/test_macos_nolibc.py -v -s -rA

  editor:
    name: Editor extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Check the extension
        working-directory: vscode-semanticscript
        run: npm run check
