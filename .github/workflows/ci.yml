name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate compiler (Windows, Python ${{ matrix.python-version }})
    # The native runtime (sqlite/http/async/gui) and the wasm/dom backends are
    # wired for Windows (runtime/manifest.json links the win/* libuv sources,
    # ws2_32, and the Win32 GUI), so the full suite runs on windows-latest.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js  # the wasm + dom integration tests run the module under node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Put clang/LLVM on PATH
        # The compiler JIT-links a native C runtime (and emits wasm) via clang;
        # windows-latest ships LLVM under Program Files.
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) { Add-Content -Path $env:GITHUB_PATH -Value $llvm }
          clang --version

      - name: Run the example suite (188 programs — the canonical green gate)
        run: python tests/run_examples.py

      - name: Run the integration tests (http server, gui, wasm, dom, apps, mcp)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($t in "test_http_server", "test_gui", "test_wasm", "test_dom", "test_apps", "test_mcp", "test_agent_tools", "test_cli_surface") {
            python "tests/$t.py"
            if ($LASTEXITCODE -ne 0) { throw "$t failed with exit $LASTEXITCODE" }
          }
