name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q SemanticScript python samples

      - name: Run linter unit tests
        run: python -m unittest SemanticScript/linter/test_semlint2.py -v

      - name: Parse smoke fixtures
        run: |
          python SemanticScript/compiler/semsc.py SemanticScript/tests/tiny.sscript --parse-only
          python SemanticScript/compiler/semsc.py SemanticScript/tests/tiny.sem --parse-only

      - name: Lint smoke fixtures
        run: |
          python SemanticScript/linter/semlint.py SemanticScript/tests/tiny.sscript --fail-on none --summary
          python SemanticScript/linter/semlint.py SemanticScript/tests/tiny.sem --fail-on none --summary

  vscode-validation:
    name: VS Code extension validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check extension JavaScript
        run: npm --prefix vscode-semanticscript run check

  release-validation:
    name: Full release validation
    runs-on: ubuntu-latest
    needs:
      - python-validation
      - vscode-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run compiler unit tests
        run: python SemanticScript/tests/test_compiler.py

      - name: Run standard library tests
        run: python SemanticScript/tests/test_stdlib.py

      - name: Run JavaScript/reference parity tests
        run: python SemanticScript/tests/compare.py

      - name: Run .sem alias parity tests
        run: python SemanticScript/tests/sem_alias_parity.py

      - name: Run self-hosted compiler parity tests
        run: python SemanticScript/tests/sem_compiler_parity.py

      - name: Run feature coverage tests
        run: python SemanticScript/tests/feature_coverage.py

      - name: Run bootstrap chain
        run: python SemanticScript/bootstrap/run_bootstrap_chain.py
