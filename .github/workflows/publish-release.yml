name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, with or without a leading v."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and tag release
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Validate release commit and create tag
        id: release
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = "Stop"

          $defaultBranch = "${{ github.event.repository.default_branch }}"
          if ("${{ github.ref_name }}" -ne $defaultBranch) {
            throw "Publish Release must be run from the default branch '$defaultBranch'."
          }

          $version = ([string]$env:INPUT_VERSION).Trim()
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$") {
            throw "Invalid semantic version '$version'."
          }
          $releaseIsPrerelease = [System.Convert]::ToBoolean(([string]$env:INPUT_PRERELEASE))

          $repoVersion = (Get-Content -Raw -Path "version.json" | ConvertFrom-Json).version
          if ($repoVersion -ne $version) {
            throw "version.json is '$repoVersion', but requested publish version is '$version'. Merge the release prep PR first."
          }

          python SemanticScript/tools/bump_version.py --check --json
          if ($LASTEXITCODE -ne 0) {
            throw "Version synchronization check failed."
          }
          python SemanticScript/tools/release_versions.py --json
          if ($LASTEXITCODE -ne 0) {
            throw "Release version matrix check failed."
          }

          $tag = "v$version"
          $notesPath = Join-Path "releases" $tag "notes.md"
          if (-not (Test-Path -Path $notesPath -PathType Leaf)) {
            throw "Expected curated release notes at '$notesPath'. Run and merge Prepare Release first."
          }

          git fetch --force --tags origin
          $headSha = (git rev-parse HEAD).Trim()
          $existingTag = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingTag) {
            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $headSha) {
              throw "Tag '$tag' already exists at $tagSha, not current default-branch HEAD $headSha."
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -F $notesPath
            git push origin $tag
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($releaseIsPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  release:
    name: Build and publish release
    needs: publish
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      prerelease: ${{ needs.publish.outputs.prerelease == 'true' }}
    permissions:
      contents: write
