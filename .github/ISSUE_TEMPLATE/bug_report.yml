name: Bug report
description: Report a reproducible SemanticScript problem.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SemanticScript. For vulnerabilities, do not open a public issue; follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke, and what did you expect instead?
      placeholder: The compiler/linter/VS Code extension...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest .sem/.sscript sample and command or extension action that reproduces it.
      placeholder: |
        1. Run `python SemanticScript/compiler/semsc.py ...`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, VS Code version if relevant, and current commit or release.
      placeholder: Windows 11, Python 3.12, VS Code 1.9x, commit abc123
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste compiler, linter, test, or extension-host output.
      render: shell
    validations:
      required: false
