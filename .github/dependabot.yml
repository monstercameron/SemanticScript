version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # The website and VS Code extension npm projects were deprecated to legacy/;
  # their dependency updates are no longer tracked. Only the live experiment
  # remains below.
  - package-ecosystem: "npm"
    directory: "/experiments/realtime-auction-arena/browser-sse-client"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "experiment"
