[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
(
  ^/build/
  | ^/third_party/
  | /build/
  | /node_modules/
  | /\.venv/
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "build",
  "third_party",
  "**/build",
  "**/node_modules",
  "**/.venv",
]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Type checking is currently scoped to the MCP server (most of the toolchain is
# untyped legacy). Run: mypy SemanticScript/tools/sem_mcp.py
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
