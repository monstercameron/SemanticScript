[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
(
  ^/build/
  | ^/third_party/
  | /build/
  | /node_modules/
  | /\.venv/
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "build",
  "third_party",
  "**/build",
  "**/node_modules",
  "**/.venv",
]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
